name: Daily News Digest

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: '只生成日报预览（不发方糖）'
        type: boolean
        default: true
  schedule:
    - cron: '25 1 * * *'

permissions:
  contents: read

concurrency:
  group: daily-news-digest

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31' 'beautifulsoup4>=4.12'
      - name: Generate news digest and optionally send to Server酱
        env:
          FTQQ_SENDKEY: ${{ secrets.FTQQ_SENDKEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_OPENAI_MODEL: ${{ vars.NEWS_OPENAI_MODEL }}
          PREVIEW_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preview_only }}
        run: |
          if [ "$PREVIEW_ONLY" = 'true' ]; then
            python news_digest.py --preview
          else
            python news_digest.py
          fi
