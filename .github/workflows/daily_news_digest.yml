name: Daily News Digest (Preview Only)

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install dependencies
        run: python -m pip install 'requests>=2.31' 'beautifulsoup4>=4.12' 'pillow>=10.3' 'opencc-python-reimplemented>=0.1.7'
      - name: Generate Chinese news images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_OPENAI_MODEL: ${{ vars.NEWS_OPENAI_MODEL }}
        run: python news_digest.py --preview --output-dir news_preview
      - uses: actions/upload-artifact@v4
        with:
          name: chinese-news-digest
          path: news_preview/
          if-no-files-found: error
